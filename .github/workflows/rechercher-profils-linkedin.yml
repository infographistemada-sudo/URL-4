name: Recherche profils LinkedIn

on:
  workflow_dispatch: {}
  # Décommentez pour un lancement automatique périodique :
  # schedule:
  #   - cron: "0 6 * * *"

# Empêche deux exécutions simultanées (important vu la reprise par fichier CSV)
concurrency:
  group: recherche-profils-linkedin
  cancel-in-progress: false

# Nécessaire pour que le job puisse commit/push (contents) et relancer
# le workflow lui-même via "gh workflow run" (actions).
permissions:
  contents: write
  actions: write

jobs:
  run-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # marge sous la limite de 6h de GitHub Actions
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pandas ddgs

      - name: Lancer le script (lot de 10 entreprises)
        env:
          BATCH_SIZE: "10"
        run: python rechercher_profils_linkedin.py

      - name: Commit et push des résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profils_linkedin_trouves.csv liste_urls.csv
          git diff --cached --quiet && echo "Rien à committer." || git commit -m "Mise à jour automatique des profils LinkedIn (lot de 10)"
          git push

      - name: Vérifier s'il reste des URLs à traiter
        id: check
        run: |
          RESTE=$(cat reste_a_traiter.txt 2>/dev/null || echo "0")
          echo "reste=$RESTE" >> "$GITHUB_OUTPUT"
          echo "Il reste $RESTE URL(s) à traiter."

      - name: Relancer automatiquement le workflow s'il reste des URLs
        if: steps.check.outputs.reste != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "rechercher-profils-linkedin.yml" --ref "${{ github.ref_name }}"
