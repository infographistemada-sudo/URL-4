name: Recherche profils LinkedIn

on:
  workflow_dispatch: {}      # lancement manuel depuis l'onglet "Actions"
  # Décommentez pour un lancement automatique périodique :
  # schedule:
  #   - cron: "0 6 * * *"

# Empêche deux exécutions simultanées (important vu la reprise par fichier CSV)
concurrency:
  group: recherche-profils-linkedin
  cancel-in-progress: false

jobs:
  run-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # un lot de 30 entreprises prend largement moins de temps
    permissions:
      contents: write          # nécessaire pour re-commit liste_urls.csv / résultats
      actions: write           # nécessaire pour déclencher le prochain lot (workflow_dispatch)

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pandas ddgs

      - name: Lancer la recherche (lot de 30 entreprises max)
        id: recherche
        env:
          BATCH_SIZE: "30"
        run: |
          # Le script sort avec le code 2 s'il reste des entreprises à traiter, 0 si
          # tout est terminé. On capture ce code sans faire échouer le job.
          set +e
          python rechercher_profils_linkedin.py
          echo "code_sortie=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Uploader les résultats comme artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profils_linkedin-${{ github.run_number }}
          path: |
            profils_linkedin_trouves.csv
            profils_ecartes_debug.csv

      - name: Committer et pousser les fichiers mis à jour
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add liste_urls.csv profils_linkedin_trouves.csv profils_ecartes_debug.csv
          git diff --staged --quiet && echo "Rien à committer." || git commit -m "Recherche profils LinkedIn - lot de 30 (run #${{ github.run_number }})"
          git push

      - name: Attendre un peu avant le lot suivant (limiter le débit)
        if: steps.recherche.outputs.code_sortie == '2'
        run: sleep 30

      - name: Déclencher le lot suivant s'il reste des entreprises à traiter
        if: steps.recherche.outputs.code_sortie == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Il reste des entreprises à traiter - déclenchement du prochain lot..."
          gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"

      - name: Tout est terminé
        if: steps.recherche.outputs.code_sortie == '0'
        run: echo "✅ Toutes les entreprises ont été traitées, aucun lot supplémentaire nécessaire."